<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedConnect — Healthcare Knowledge & Collaboration</title>
  <meta name="description" content="Verified medical knowledge & collaboration platform. Bilingual (Arabic / English), offline-ready." />

  <!-- ===== Google Fonts (enhancement; system fallback in styles.css) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- ===== Tailwind Play CDN (utility classes used throughout app.js) =====
       Provides bg-*, text-*, flex, grid, rounded, etc. The themed color
       tokens are mapped in the tailwind.config script below so classes
       like bg-primary / text-muted-foreground resolve to styles.css vars. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind config — maps color utilities to the RGB-channel CSS
    // variables defined in styles.css, enabling /alpha modifiers.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'rgb(var(--background) / <alpha-value>)',
            foreground: 'rgb(var(--foreground) / <alpha-value>)',
            card: { DEFAULT: 'rgb(var(--card) / <alpha-value>)', foreground: 'rgb(var(--card-foreground) / <alpha-value>)' },
            popover: { DEFAULT: 'rgb(var(--popover) / <alpha-value>)', foreground: 'rgb(var(--popover-foreground) / <alpha-value>)' },
            primary: { DEFAULT: 'rgb(var(--primary) / <alpha-value>)', foreground: 'rgb(var(--primary-foreground) / <alpha-value>)' },
            secondary: { DEFAULT: 'rgb(var(--secondary) / <alpha-value>)', foreground: 'rgb(var(--secondary-foreground) / <alpha-value>)' },
            muted: { DEFAULT: 'rgb(var(--muted) / <alpha-value>)', foreground: 'rgb(var(--muted-foreground) / <alpha-value>)' },
            accent: { DEFAULT: 'rgb(var(--accent) / <alpha-value>)', foreground: 'rgb(var(--accent-foreground) / <alpha-value>)' },
            destructive: { DEFAULT: 'rgb(var(--destructive) / <alpha-value>)', foreground: '#ffffff' },
            border: 'rgb(var(--border) / <alpha-value>)',
            input: 'rgb(var(--input) / <alpha-value>)',
            ring: 'rgb(var(--ring) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Tahoma', 'Arial', 'sans-serif'],
            arabic: ['Cairo', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- ===== Project styles (theme variables, RTL, animations, utilities) ===== -->
  <link rel="stylesheet" href="styles.css" />

  <!-- ===== React 18 UMD + Babel standalone (transpiles app.js JSX) ===== -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- lucide UMD — icon set. If this CDN is unreachable offline, the Icon
       component (app.js) falls back to ApiService.iconFallbackSvg(). -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- qrcodejs — real scannable QR generation (online). If unreachable,
       QrAccessModal falls back to ApiService.qrFallbackSvg() (offline). -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- ===== Root mount point + boot loader (replaced when React mounts) ===== -->
  <div id="root">
    <div id="boot-loader">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0d9488,#0284c7);display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        </div>
        <div class="mc-spin"></div>
        <div style="font-size:13px;color:#64748b;">Loading MedConnect…</div>
      </div>
    </div>
  </div>

  <!-- ===== Data layer (plain JS global: window.MCData) =====
       Must load BEFORE app.js so components can read doctors/specialties. -->
  <script src="data.js"></script>

  <!-- ===== API layer (plain JS global: window.ApiService) =====
       localStorage CRUD + Gemini hook + offline fallbacks. Loads before
       app.js so the store and components can call it. -->
  <script src="api.js"></script>

  <!-- ===== Application (JSX) =====
       Loaded as a non-Babel type so Babel does NOT auto-process it with
       the automatic runtime (which emits ESM imports). Instead, the
       runner script below fetches app.js and transforms it with the
       CLASSIC runtime (React.createElement) so it runs as a plain script. -->
  <script type="text/x-jsx" src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var el = document.querySelector('script[type="text/x-jsx"]');
      var url = el.getAttribute("src");
      fetch(url)
        .then(function (r) { return r.text(); })
        .then(function (src) {
          var out = Babel.transform(src, {
            presets: [["react", { runtime: "classic" }]],
            filename: "app.js",
          }).code;
          var s = document.createElement("script");
          s.textContent = out;
          document.body.appendChild(s);
        })
        .catch(function (err) {
          var boot = document.getElementById("boot-loader");
          if (boot) {
            boot.innerHTML =
              '<div style="text-align:center;max-width:520px;padding:24px;">' +
              '<div style="font-size:18px;font-weight:700;color:#0f766e;margin-bottom:8px;">MedConnect failed to start</div>' +
              '<pre style="white-space:pre-wrap;font-size:12px;color:#be123c;background:#fff5f5;padding:12px;border-radius:8px;border:1px solid #fecdd3;">' +
              String(err && err.message ? err.message : err) + "</pre></div>";
          }
          console.error(err);
        });
    });
  </script>
</body>
</html>
